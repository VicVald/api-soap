[project]
name = "api-soap"
version = "0.1.0"
description = "API Servidor SOAP em Python 3.11 para Consulta de CEP integrada ao ViaCEP"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "a2wsgi>=1.10.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "spyne>=2.14.0",
    "uvicorn>=0.30.0",
    "zeep>=4.2.0",
]
